[versions]
lib-androidx-activity-compose = "1.13.0"
lib-androidx-compose-bom = "2026.06.01"
lib-androidx-core-splashscreen = "1.2.0"
lib-androidx-datastore = "1.2.1"
lib-androidx-espresso-core = "3.7.0"
lib-androidx-junit = "1.3.0"
lib-jna = "5.19.1"
lib-junit = "4.13.2"
lib-navigation-compose = "2.9.8"
lib-serialization-json = "1.11.0"
plug-android-application = "9.2.1"
plug-kotlin-compose = "2.4.0"
plug-kotlin-serialization = "2.4.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "lib-androidx-activity-compose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "lib-androidx-compose-bom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "lib-androidx-core-splashscreen" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "lib-androidx-datastore" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "lib-androidx-espresso-core" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "lib-androidx-junit" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "lib-navigation-compose" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "lib-jna" }
junit = { group = "junit", name = "junit", version.ref = "lib-junit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "lib-serialization-json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "plug-android-application" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "plug-kotlin-compose" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "plug-kotlin-serialization" }
