kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "lib-serialization-json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "plug-android-application" }
detekt = { id = "dev.detekt", version.ref = "plug-detekt" }
google-services = { id = "com.google.gms.google-services", version.ref = "plug-google-services" }
