androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "lib-androidx-core-splashscreen" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "lib-androidx-datastore" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "lib-androidx-espresso-core" }
